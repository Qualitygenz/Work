<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Fake GitHub Video File</title>
<style>
    body{
        background:#0d1117;
        color:white;
        font-family:Arial;
        display:flex;
        justify-content:center;
        align-items:center;
        height:100vh;
        margin:0;
    }

    .github-box{
        width:700px;
        background:#161b22;
        border:1px solid #30363d;
        border-radius:10px;
        padding:20px;
    }

    .file{
        display:flex;
        align-items:center;
        gap:10px;
        padding:12px;
        border-radius:8px;
        cursor:pointer;
        transition:.2s;
    }

    .file:hover{
        background:#21262d;
    }

    .icon{
        width:18px;
        height:18px;
        background:#58a6ff;
        border-radius:3px;
    }

    .name{
        color:#58a6ff;
        text-decoration:none;
        font-size:15px;
    }

    video{
        width:100%;
        margin-top:20px;
        border-radius:10px;
        display:none;
    }
</style>
</head>
<body>

<div class="github-box">

    <div class="file" onclick="openVideo()">
        <div class="icon"></div>

        <a class="name">
            VID_20260508_213552_114.mp4
        </a>
    </div>

    <video id="vid" controls>
        <source src="https://raw.githubusercontent.com/Qualitygenz/Work/main/VID_20260508_213552_114.mp4" type="video/mp4">
    </video>

</div>

<script>
function openVideo(){
    document.getElementById("vid").style.display = "block";
}
</script>

</body>
</html>
